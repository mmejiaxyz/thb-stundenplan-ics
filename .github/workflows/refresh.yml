name: Refresh schedule

on:
  schedule:
    - cron: "5 5 * * *"   # 05:05 UTC daily (THB generates the files ~3:00 local)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate .ics
        run: python crawl.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to the schedule."
          else
            git commit -m "Refresh schedule $(date -u +%F)"
            git push
          fi